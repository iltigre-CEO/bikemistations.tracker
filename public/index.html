<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172c28">
  <meta name="description" content="La tua mappa personale delle stazioni BikeMi: storico sincronizzato, progressi e posizione sul telefono.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>BikeMi Explorer</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <noscript>Per usare la mappa abilita JavaScript nel browser. / Enable JavaScript to use the map.</noscript>
  <div id="app">
    <header class="site-header">
      <a class="brand" href="./" aria-label="BikeMi Explorer"><span class="brand-icon" data-icon="bike"></span><span>BikeMi<span class="brand-light">Explorer</span><small data-i18n="tagline">LA TUA MAPPA DI MILANO</small></span></a>
      <div class="header-meta"><span class="local-pill"><i></i><span data-i18n="personal"></span></span><button id="language-quick" class="language-btn" type="button" aria-label="Change language">EN</button></div>
    </header>
    <main id="map-page">
      <div id="map" class="interactive-map" tabindex="0" role="region" aria-label="Mappa interattiva"></div>
      <div class="map-overlay">
        <aside class="explorer-panel">
          <div class="desktop-intro"><span class="eyebrow" data-i18n="personal"></span><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div>
          <div class="search-box"><span data-icon="search"></span><input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" aria-label="Cerca una stazione BikeMi"><kbd>/</kbd><div id="search-results" class="search-results" hidden></div></div>
          <button id="progress-card" class="progress-card" type="button">
            <div class="progress-top"><span class="eyebrow" data-i18n="activeNetwork"></span><span class="percent" id="progress-percent">0%</span></div>
            <div class="progress-numbers"><strong id="visited-count">0</strong><span>/ <span id="total-count">--</span></span><span class="visited-caption" data-i18n="visitedLower"></span><span class="progress-arrow" data-icon="arrow"></span></div>
            <div class="progress-track"><span id="progress-fill"></span></div>
            <div class="progress-footer"><span id="remaining-count">--</span> <span data-i18n="remaining"></span><span class="tiny-dots"><i></i><i></i><i></i></span></div>
          </button>
          <div class="filters" role="group" aria-label="Filtri stazioni"><button data-filter="all" class="active" data-i18n="all"></button><button data-filter="missing" data-i18n="missing"></button><button data-filter="visited" data-i18n="visited"></button><button data-filter="nearby" class="nearby-chip" data-i18n="nearby"></button></div>
          <div class="desktop-sync"><p id="connection-summary" data-i18n="connectFirst"></p><button class="primary full" data-action="sync"><span data-icon="sync"></span><span data-i18n="sync"></span><span data-icon="arrow"></span></button><span class="last-sync-label"></span></div>
        </aside>
        <div class="map-controls">
          <button id="zoom-in" class="square" data-i18n-title="zoomIn"><span data-icon="plus"></span></button>
          <button id="zoom-out" class="square" data-i18n-title="zoomOut"><span data-icon="minus"></span></button>
          <button id="show-milan" class="square" data-i18n-title="mapCenter"><span data-icon="map"></span></button>
          <button id="locate" class="square locate" data-i18n-title="myLocation"><span data-icon="location"></span></button>
        </div>
        <div class="bottom-map-tools">
          <button id="nearest" class="nearest-btn"><span data-icon="navigation"></span><span data-i18n="nearest"></span><span data-icon="arrow"></span></button>
          <button class="primary mobile-sync" data-action="sync"><span data-icon="sync"></span><span data-i18n="sync"></span></button>
        </div>
        <div id="location-banner" class="location-banner" hidden><span data-icon="location"></span><span data-i18n="launchIntro"></span><button id="location-intro-yes" data-i18n="enableLocation"></button><button id="location-intro-no" aria-label="Chiudi"><span data-icon="close"></span></button></div>
        <div class="map-legend"><span><i class="legend-dot green"></i><span data-i18n="visited"></span></span><span><i class="legend-dot grey"></i><span data-i18n="missing"></span></span></div>
        <button id="data-source" class="source-pill"></button>
        <div class="map-attribution"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a> <span>&middot;</span> <a href="https://bikemi.com/open-data/realtime" target="_blank" rel="noopener">BikeMi GBFS</a></div>
      </div>
    </main>
    <nav class="bottom-nav" aria-label="Navigazione"><button class="active" data-nav="map"><span data-icon="map"></span><span data-i18n="map"></span></button><button data-nav="progress"><span data-icon="chart"></span><span data-i18n="progress"></span></button><button data-nav="settings"><span data-icon="user"></span><span data-i18n="settings"></span></button></nav>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="panel" class="panel"><div class="sheet-handle"></div><button class="dialog-close square" id="close-panel" aria-label="Chiudi"><span data-icon="close"></span></button><div id="panel-content"></div></dialog>
  </div>
</body>
</html>
